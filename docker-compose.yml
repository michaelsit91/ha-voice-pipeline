services:
  ha-voice-pipeline:
    build: .
    image: ha-voice-pipeline:latest
    container_name: ha-voice-pipeline
    restart: unless-stopped
    ports:
      - "${PORT:-18795}:${PORT:-18795}"
    env_file:
      - config.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:18795/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - llm-voice

networks:
  llm-voice:
    external: true
    name: llm-voice_default
