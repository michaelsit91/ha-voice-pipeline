services:
  ha-voice-pipeline:
    build: .
    image: ha-voice-pipeline:latest
    container_name: ha-voice-pipeline
    # always, not unless-stopped: a host driver-upgrade reboot leaves
    # unless-stopped containers down until someone notices.
    restart: always
    ports:
      - "${PORT:-18795}:${PORT:-18795}"
    env_file:
      - config.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # /health is unconditional liveness and cannot see a dead dependency.
      # /health/deep probes HA and the LLM and answers 503 when either is down.
      test: ["CMD", "curl", "-sf", "http://localhost:18795/health/deep"]
      interval: 30s
      # Two dependency probes at 4s each, plus request overhead.
      timeout: 10s
      retries: 3
      start_period: 15s
    # Every voice transcript is logged verbatim, so unrotated logs grow without bound.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          # Request routing and HTTP clients only — inference runs in Ollama.
          memory: 512M
    networks:
      - llm-voice

networks:
  llm-voice:
    external: true
    name: llm-voice_default
